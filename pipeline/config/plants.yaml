  # ===== Expansion clusters (added 2026-10-08) =====
  # Source: GEM Global Coal Plant Tracker (January 2026 release), via api.globalenergymonitor.org.
  # lat/lon are the capacity-weighted mean of GEM unit coordinates (units of a plant lie within 0.02 deg);
  # capacity_mw is the GEM total for units with the given status. cea_names were checked against the
  # DGR2 reports of 2019-01-15 and 2026-10-06. Each cluster centroid is >= 100 km from every other.
  # Rejected: Raigarh/Tamnar (61-88 km from Korba, Marwa, Jharsuguda), Farakka (82 km from Kahalgaon).

  # --- talcher (Odisha). Not in DGR2, so not modelled: NALCO Angul smelter CPP (1200 MW, 30 km) and
  # JSPL Angul steel CPP (810 MW, 24 km); Kamalanga TPS (1050 MW) is 32 km out. All are excluded from the background.

