# Coal plant registry. One entry per plant; plants sharing a Sentinel-5P pixel share a cluster.
#
# lat/lon and capacity_mw: Global Energy Monitor (GEM) wiki, the public page for the
# Global Coal Plant Tracker (coord_source). capacity_mw is operating capacity and
# matches the monitored capacity in CEA DGR2.
# cea_names: exact plant-row spellings in CEA DGR2 (Subreport-2). Checked against
# sample reports from 2019-01 through 2026-10; the coal plant names did not change.
# fgd_status / scr_status: installed | under_construction | not_installed | null (unknown).
# Not yet sourced, so all null for now.
# cluster: singrauli = Singrauli/Sonbhadra belt (MP/UP border); korba = Korba coalfield.
# Marwa is ~35 km from the nearest Korba plant (DSPM), which exceeds the 25 km rule, so it has its own cluster.
plants:
  - id: vindhyachal-stps
    name: Vindhyachal STPS
    cea_names: ["VINDHYACHAL STPS"]
    state: Madhya Pradesh
    lat: 24.0983
    lon: 82.6719
    capacity_mw: 4760
    cluster: singrauli
    fgd_status: null
    scr_status: null
    coord_source: https://www.gem.wiki/Vindhyachal_power_station

